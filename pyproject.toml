[project]
name = "camera-chess"
version = "0.1.0"
description = "R&D for CameraChess: data, model training and evaluation, including ChessQueries"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = "==3.13.*"
dependencies = [
    "chess==1.11.2",
    "eva-decord==0.6.1",
    "gdown==5.2.2",
    "loguru==0.7.3",
    "numpy==2.5.4",
    # torch.onnx.export needs it, even with dynamo=False
    "onnx==1.23.2",
    # With its own CUDA and cuDNN, as pip packages
    "onnxruntime-gpu[cuda,cudnn]==1.31.1",
    "opencv-python==4.11.0.86",
    "orjson==3.13.0",
    "osfclient==0.0.5",
    "pillow==13.0.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "pytorch-lightning==2.6.6",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "safetensors==0.8.0",
    "scipy==1.17.1",
    "timm==1.0.30",
    "torch==2.15.0",
    "torchcodec==0.17.0",
    "torchvision==0.29.2",
    "tqdm==4.70.1",
]

[tool.uv]
# Scripts run as modules from the repo root, e.g. python -m camera_chess.videos.overlay_moves, so it is not installed
package = false
# The Modal and W&B tooling is light, and the tests and type checks cover it
default-groups = ["dev", "modal"]
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==8.4.2",
    "ruff==0.17.3",
    "ty==0.0.95",
]
# Blender as a module, for the synthetic renderer (camera_chess/synthetic/); needs Python 3.13
synthetic = ["bpy==5.2.3"]
# Running the app's model on TensorRT (camera_chess/videos/chesscam_model.py)
tensorrt = ["tensorrt-cu13>=10,<11"]
# Exporting the ChessVision-3LC weights to ONNX, once (camera_chess/videos/chessvision_3lc.py)
chessvision-export = ["ultralytics==8.4.197"]
# Submitting ChessQueries training runs to Modal (scripts/train_chessqueries_modal.py) and logging them to W&B.
# The Modal image pins its own copy of the training dependencies; this group is the local side.
modal = [
    "modal==1.6.2",
    "wandb==0.22.3",
]

[tool.ruff]
line-length = 120

[tool.ty.src]
exclude = [".venv", "**/__pycache__", "data"]

[tool.ty.analysis]
# Run outside this environment: the ONNX and LiteRT exporters pin their own converters
allowed-unresolved-imports = ["litert_torch", "litert_torch.**", "tflite", "ai_edge_litert", "ai_edge_litert.**"]
# Compiled modules with no stubs (bmesh and mathutils only exist once bpy is imported). All are in optional
# dependency groups, so treating them as Any gives the same result whether or not they are installed.
replace-imports-with-any = [
    "bpy", "bpy.**", "bmesh", "bmesh.**", "mathutils", "mathutils.**",
    "tensorrt", "tensorrt.**", "ultralytics", "ultralytics.**",
]

[tool.ty.rules]
# nn.Module declares `forward` as a Callable attribute, so every `def forward` override trips this.
invalid-mutable-override = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
