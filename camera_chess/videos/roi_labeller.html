<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROI Labeller</title>
<style>
  :root {
    --bg: #1b1d21; --panel: #24272c; --text: #e6e6e6; --muted: #9aa0a6; --line: #3a3e44;
    --overlay: #3ec7e0; --board: #f0a030; --active: #2f6fdd; --unusable: #e05050;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif;
         display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  aside button { display: flex; gap: 8px; width: 100%; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--line);
                 background: none; color: var(--text); text-align: left; cursor: pointer; font: inherit; }
  aside button.current { background: #33373e; }
  aside .dots { flex: none; display: flex; gap: 3px; padding-top: 4px; }
  aside .dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); }
  aside .title { font-size: 12px; line-height: 1.3; }
  aside .dataset { color: var(--muted); font-size: 11px; }
  aside button.unusable .title, aside button.unusable .dataset { text-decoration: line-through; opacity: 0.5; }
  main { display: flex; flex-direction: column; padding: 12px; gap: 10px; min-width: 0; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
                    color: var(--text); cursor: pointer; font: inherit; }
  .toolbar button.selected { border-color: currentColor; }
  .toolbar #unusable.selected { color: var(--unusable); }
  .toolbar .status { color: var(--muted); margin-left: auto; }
  .stage { position: relative; align-self: flex-start; max-width: 100%; max-height: calc(100vh - 140px); }
  video { display: block; max-width: 100%; max-height: calc(100vh - 140px); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .scrub { display: flex; gap: 10px; align-items: center; }
  .scrub input { flex: 1; }
  .help { color: var(--muted); font-size: 12px; }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<aside id="list"></aside>
<main>
  <div class="toolbar">
    <button id="play">Play <kbd>space</kbd></button>
    <button id="unusable">Unusable <kbd>u</kbd></button>
    <button id="next">Next video <kbd>e</kbd></button>
    <span class="status" id="status"></span>
  </div>
  <div class="stage">
    <video id="video" muted playsinline preload="auto"></video>
    <canvas id="canvas"></canvas>
  </div>
  <div class="scrub">
    <input type="range" id="seek" min="0" max="1" step="0.1" value="0">
    <span id="time">0:00</span>
  </div>
  <div class="help">
    Drag on the video to draw the 3D board box (orange). It saves at once. The 2D box (blue) is the script's, shown read-only.
    <kbd>←</kbd>/<kbd>→</kbd> seek 5 s, <kbd>p</kbd> previous video, <kbd>u</kbd> marks or unmarks the video as unusable.
  </div>
</main>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const seek = document.getElementById("seek");
const status = document.getElementById("status");
let videos = [];
let index = 0;
// The box being dragged, in video pixels
let drag = null;

const color = (name = "--board") => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const formatTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

const renderList = () => {
  const list = document.getElementById("list");
  list.replaceChildren(...videos.map((v, i) => {
    const button = document.createElement("button");
    button.classList.toggle("current", i === index);
    button.classList.toggle("unusable", v.unusable);
    const dots = document.createElement("span");
    dots.className = "dots";
    for (const [key, name] of [["roi", "--board"], ["overlay_roi", "--overlay"]]) {
      const dot = document.createElement("span");
      dot.className = "dot";
      if (v[key]) dot.style.background = color(name);
      dots.append(dot);
    }
    const text = document.createElement("span");
    text.innerHTML = `<div class="title"></div><div class="dataset"></div>`;
    text.querySelector(".title").textContent = v.title;
    text.querySelector(".dataset").textContent = v.dataset;
    button.append(dots, text);
    button.onclick = () => open(i);
    return button;
  }));
}

const draw = () => {
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const v = videos[index];
  // The 2D box comes from a script and is shown read-only, so you can check it
  const boxes = [[v?.overlay_roi, "--overlay", "2D"], [drag ?? v?.roi, "--board", "3D"]];
  for (const [box, name, label] of boxes) {
    if (!box) continue;
    ctx.strokeStyle = ctx.fillStyle = color(name);
    ctx.lineWidth = 3;
    ctx.strokeRect(...box);
    ctx.font = "bold 18px system-ui";
    ctx.fillText(label, box[0] + 6, box[1] + 22);
  }
}

const open = (i) => {
  index = (i + videos.length) % videos.length;
  const v = videos[index];
  video.src = `/video/${encodeURIComponent(v.dataset)}`;
  document.getElementById("unusable").classList.toggle("selected", v.unusable);
  renderList();
  status.textContent = "";
  draw();
}

const toVideo = (event) => {
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * canvas.width / rect.width;
  const y = (event.clientY - rect.top) * canvas.height / rect.height;
  return [Math.max(0, Math.min(canvas.width, x)), Math.max(0, Math.min(canvas.height, y))];
}

const save = (labels) => fetch("/api/labels", {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(labels)
});

const toggleUnusable = async () => {
  const v = videos[index];
  v.unusable = !v.unusable;
  document.getElementById("unusable").classList.toggle("selected", v.unusable);
  renderList();
  const response = await save({ dataset: v.dataset, unusable: v.unusable });
  status.textContent = response.ok ? (v.unusable ? "Marked unusable" : "Marked usable") : "Save failed";
}

let origin = null;
canvas.addEventListener("pointerdown", (event) => {
  canvas.setPointerCapture(event.pointerId);
  origin = toVideo(event);
  drag = [...origin, 0, 0];
});
canvas.addEventListener("pointermove", (event) => {
  if (!origin) return;
  const [x, y] = toVideo(event);
  drag = [Math.min(x, origin[0]), Math.min(y, origin[1]), Math.abs(x - origin[0]), Math.abs(y - origin[1])];
  draw();
});
canvas.addEventListener("pointerup", async () => {
  const box = drag.map(Math.round);
  origin = null;
  drag = null;
  // A click without a drag leaves the box as it was
  if (box[2] < 10 || box[3] < 10) {
    draw();
    return;
  }
  const v = videos[index];
  v.roi = box;
  draw();
  renderList();
  const response = await save({ dataset: v.dataset, roi: box });
  status.textContent = response.ok ? "Saved 3D box" : "Save failed";
});

video.addEventListener("loadedmetadata", () => {
  seek.max = video.duration;
  // Most videos show the start position for a moment, so start a little way in
  video.currentTime = Math.min(30, video.duration / 2);
  draw();
});
video.addEventListener("timeupdate", () => {
  seek.value = video.currentTime;
  document.getElementById("time").textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration || 0)}`;
});
video.addEventListener("play", () => document.getElementById("play").firstChild.textContent = "Pause ");
video.addEventListener("pause", () => document.getElementById("play").firstChild.textContent = "Play ");
seek.addEventListener("input", () => video.currentTime = Number(seek.value));

const togglePlay = () => video.paused ? video.play() : video.pause();
document.getElementById("play").onclick = togglePlay;
document.getElementById("unusable").onclick = toggleUnusable;
document.getElementById("next").onclick = () => open(index + 1);
document.addEventListener("keydown", (event) => {
  if (event.target === seek && event.key.startsWith("Arrow")) event.preventDefault();
  if (event.key === " ") { event.preventDefault(); togglePlay(); }
  else if (event.key === "ArrowRight") video.currentTime += 5;
  else if (event.key === "ArrowLeft") video.currentTime -= 5;
  else if (event.key === "u") toggleUnusable();
  else if (event.key === "e") open(index + 1);
  else if (event.key === "p") open(index - 1);
});

// Unlabelled first, so what still needs drawing is at the top, and unusable videos last. Sorted on load only, so the list doesn't jump while
// drawing; reloading sorts it again.
const boxes = (v) => v.unusable ? 2 : v.roi ? 1 : 0;

fetch("/api/videos").then((r) => r.json()).then((list) => {
  // A stable sort keeps the server's order within each count
  videos = list.sort((a, b) => boxes(a) - boxes(b));
  const first = videos.findIndex((v) => !v.unusable && !v.roi);
  open(first === -1 ? 0 : first);
});
</script>
</body>
</html>
