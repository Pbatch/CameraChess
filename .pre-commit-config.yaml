# Install once with `uv run pre-commit install`; run on everything with `uv run pre-commit run --all-files`.
# The ruff, ty and uv hooks run the versions pinned in uv.lock, so they match CI (.github/workflows/checks.yml).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      # Datasets, checkpoints and renders belong under the gitignored data/, checkpoints/ and outputs/
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      # Checks the whole project, since a change in one file can break types in another
      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
